<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuletaApp</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAVBAR SUPERIOR -->
  <header class="navbar">
    <div class="logo">🎰 RuletaApp</div>
    <div class="nav-tabs">
      <button id="tab-objetos" class="tab-btn active">📦 Ruleta Objetos</button>
      <button id="tab-youtube" class="tab-btn">🔴 Ruleta YouTube Live</button>
    </div>
    <div class="status-badge">🟢 Listo</div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="main-container">
    
    <!-- ÁREA DE LA RULETA -->
    <section class="wheel-section">
      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="450" height="450"></canvas>
      </div>
      <div class="wheel-controls">
        <button id="spinBtn" class="btn-spin">¡GIRAR RULETA!</button>
      </div>
    </section>

    <!-- PANEL LATERAL DE SECCIONES -->
    <aside class="sidebar-panel">
      
      <!-- SUBPÁGINA 1: OBJETOS LOCALES -->
      <div id="sec-objetos" class="subpage-content active">
        <div class="panel-header">
          <h2>Lista de Objetos</h2>
          <div class="panel-header-right">
            <span class="item-count">0 ítems</span>
            <button id="btnResetHeader" class="btn-reset-icon" title="Reiniciar lista">🔄</button>
          </div>
        </div>
        <div id="itemsList" class="items-list"></div>
      </div>

      <!-- SUBPÁGINA 2: YOUTUBE LIVE -->
      <div id="sec-youtube" class="subpage-content">
        <div class="panel-header">
          <h2>Sorteo YouTube Live</h2>
        </div>
        <div class="yt-form">
          <div class="form-group">
            <label for="ytUrl">URL o ID del Directo:</label>
            <input type="text" id="ytUrl" placeholder="https://youtube.com/live/..." />
          </div>
          <div class="form-group">
            <label for="ytKeyword">Palabra Clave del Sorteo:</label>
            <input type="text" id="ytKeyword" placeholder="Ej: !participo" />
          </div>
          <button id="btnStartCollect" class="btn-yt-start">Iniciar Recolección</button>
        </div>
        <div class="empty-state">
          <p>Participantes Detectados: <strong>0</strong></p>
          <small>Ingresa los datos para empezar a leer el chat.</small>
        </div>
      </div>

    </aside>

  </div>

  <!-- MODAL DE RESULTADO GANADOR -->
  <div id="modalGanador" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 class="modal-title">🎉 ¡Resultado!</h2>
      <div class="modal-img-container">
        <img id="modalImg" src="" alt="Ganador" class="modal-img-preview" />
      </div>
      <h3 id="modalNombre">Nombre Premio</h3>
      
      <!-- BADGE DE CATEGORÍA -->
      <span id="modalCategory" class="item-category" style="margin-bottom: 16px;"></span>

      <div class="modal-actions">
        <button id="btnEliminarItem" class="btn-danger">Eliminar y Continuar</button>
        <button id="btnCerrarModal" class="btn-secondary">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS EN CARPETA ASSETS -->
  <script src="assets/items.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
